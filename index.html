<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Street Cleaner - Anti Drug Squad BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #fff;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #gameCanvas {
      background: #1e293b;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2">

  <!-- HUD Header -->
  <div class="w-full max-w-2xl flex justify-between items-center bg-slate-900 border border-emerald-500/40 p-3 rounded-xl mb-2">
    <div>
      <span class="text-xs text-emerald-400 font-bold uppercase">Score</span>
      <div id="scoreText" class="text-2xl font-black text-emerald-300">0</div>
    </div>
    <div class="text-center">
      <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-red-500">
        BD STREET CLEANER
      </h1>
      <span class="text-[10px] text-slate-400">Anti-Drug Action Game</span>
    </div>
    <div class="text-right">
      <span class="text-xs text-rose-400 font-bold uppercase">Health</span>
      <div id="livesText" class="text-2xl font-black text-rose-500">❤️❤️❤️</div>
    </div>
  </div>

  <!-- Canvas Container -->
  <div class="relative w-full max-w-2xl">
    <canvas id="gameCanvas" width="700" height="400" class="w-full rounded-2xl border-2 border-slate-700 block"></canvas>
    
    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur flex flex-col items-center justify-center rounded-2xl hidden">
      <h2 class="text-4xl font-black text-rose-500 tracking-wider mb-2">MISSION FAILED</h2>
      <p class="text-slate-300 mb-4">Total Score: <span id="finalScore" class="text-emerald-400 font-bold">0</span></p>
      <button onclick="restartGame()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl shadow-lg text-lg transition">
        PLAY AGAIN
      </button>
    </div>
  </div>

  <!-- Controls -->
  <div class="w-full max-w-2xl grid grid-cols-3 gap-2 mt-3">
    <button id="btnUp" class="bg-slate-800 border border-slate-700 text-emerald-400 font-bold py-3 rounded-xl text-lg active:bg-slate-700">▲ UP</button>
    <button id="btnFire" class="bg-gradient-to-r from-red-600 to-emerald-600 text-white font-black py-3 rounded-xl text-lg shadow-lg active:scale-95">🔥 DUAL FIRE</button>
    <button id="btnDown" class="bg-slate-800 border border-slate-700 text-emerald-400 font-bold py-3 rounded-xl text-lg active:bg-slate-700">▼ DOWN</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let gameOver = false;
    let roadOffset = 0;

    // Load User Head Image
    const playerHeadImg = new Image();
    playerHeadImg.src = 'https://i.ibb.co/6P0J9k8/custom-head.jpg'; // Using uploaded face photo URL

    // Player Object
    const player = {
      x: 60,
      y: 180,
      width: 55,
      height: 75,
      speed: 6
    };

    let bullets = [];
    let enemies = [];
    let particles = [];

    const keys = { up: false, down: false, space: false };

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        if (!keys.space) shootBullets();
        keys.space = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
      if (e.key === ' ' || e.key === 'Spacebar') keys.space = false;
    });

    // Touch Controls
    document.getElementById('btnUp').addEventListener('mousedown', () => keys.up = true);
    document.getElementById('btnUp').addEventListener('mouseup', () => keys.up = false);
    document.getElementById('btnDown').addEventListener('mousedown', () => keys.down = true);
    document.getElementById('btnDown').addEventListener('mouseup', () => keys.down = false);
    document.getElementById('btnFire').addEventListener('click', () => shootBullets());

    function shootBullets() {
      if (gameOver) return;
      // Dual Guns shooting
      bullets.push({ x: player.x + 45, y: player.y + 38, speed: 10 });
      bullets.push({ x: player.x + 45, y: player.y + 52, speed: 10 });
    }

    function spawnEnemy() {
      if (gameOver) return;
      const type = Math.random() > 0.5 ? 'lungi' : 'shorts';
      enemies.push({
        x: canvas.width + 30,
        y: Math.random() * (canvas.height - 180) + 110,
        width: 40,
        height: 65,
        type: type,
        speed: Math.random() * 2 + 2.5
      });
    }

    setInterval(spawnEnemy, 1200);

    function drawBackground() {
      // Sky & Wall
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, 100);
      
      // Wall details (Bangladesh brick design)
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, 70, canvas.width, 30);
      
      // Road
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 100, canvas.width, canvas.height - 100);

      // Moving Road Lines
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.setLineDash([20, 20]);
      ctx.lineDashOffset = -roadOffset;
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.lineTo(canvas.width, 250);
      ctx.stroke();
      ctx.setLineDash([]);

      // Rickshaw/Trash can scenery on side
      ctx.fillStyle = '#059669';
      ctx.fillRect((200 - roadOffset) % canvas.width, 45, 30, 25);
      ctx.fillStyle = '#fff';
      ctx.font = '10px Arial';
      ctx.fillText('ডাস্টবিন', (200 - roadOffset) % canvas.width, 40);
    }

    function drawPlayer() {
      // Body (Suit)
      ctx.fillStyle = '#475569';
      ctx.fillRect(player.x + 12, player.y + 30, 20, 30); // Torso

      // Dual Guns
      ctx.fillStyle = '#000';
      ctx.fillRect(player.x + 28, player.y + 36, 20, 6); // Top Gun
      ctx.fillRect(player.x + 28, player.y + 50, 20, 6); // Bottom Gun

      // Legs (Running animation effect)
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(player.x + 14, player.y + 60, 6, 15);
      ctx.fillRect(player.x + 24, player.y + 60, 6, 15);

      // Big Head (Custom Face)
      if (playerHeadImg.complete) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x + 22, player.y + 16, 22, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(playerHeadImg, player.x, player.y - 6, 44, 44);
        ctx.restore();
      } else {
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath();
        ctx.arc(player.x + 22, player.y + 16, 20, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawEnemies() {
      enemies.forEach(e => {
        // Body (Lungi or Shorts)
        if (e.type === 'lungi') {
          ctx.fillStyle = '#0284c7'; // Lungi color
          ctx.fillRect(e.x + 10, e.y + 35, 20, 25);
        } else {
          ctx.fillStyle = '#dc2626'; // Shorts
          ctx.fillRect(e.x + 10, e.y + 35, 20, 15);
        }

        // Upper body
        ctx.fillStyle = '#fdba74';
        ctx.fillRect(e.x + 12, e.y + 20, 16, 15);

        // Head
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.arc(e.x + 20, e.y + 12, 10, 0, Math.PI * 2);
        ctx.fill();

        // Polythene / Drug Item in Mouth
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(e.x + 8, e.y + 16, 6, 0, Math.PI * 2); // Polythene bag
        ctx.fill();
      });
    }

    function update() {
      if (gameOver) return;

      roadOffset += 4;

      // Move Player
      if (keys.up && player.y > 105) player.y -= player.speed;
      if (keys.down && player.y + player.height < canvas.height - 10) player.y += player.speed;

      // Bullets
      bullets.forEach((b, i) => {
        b.x += b.speed;
        if (b.x > canvas.width) bullets.splice(i, 1);
      });

      // Enemies
      enemies.forEach((e, eIdx) => {
        e.x -= e.speed;

        // Bullet Hit Collision
        bullets.forEach((b, bIdx) => {
          if (
            b.x > e.x &&
            b.x < e.x + e.width &&
            b.y > e.y &&
            b.y < e.y + e.height
          ) {
            enemies.splice(eIdx, 1);
            bullets.splice(bIdx, 1);
            score += 10;
            document.getElementById('scoreText').innerText = score;
          }
        });

        // Player Collision or Missed Enemy
        if (e.x < 0) {
          enemies.splice(eIdx, 1);
          lives--;
          updateHUD();
        }
      });
    }

    function updateHUD() {
      document.getElementById('livesText').innerText = '❤️'.repeat(Math.max(0, lives));
      if (lives <= 0) {
        gameOver = true;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      drawPlayer();
      drawEnemies();

      // Bullets
      ctx.fillStyle = '#f59e0b';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, 10, 3);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function restartGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      bullets = [];
      enemies = [];
      document.getElementById('scoreText').innerText = '0';
      updateHUD();
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    loop();
  </script>
</body>
</html>

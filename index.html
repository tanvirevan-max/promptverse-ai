<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Cyber Defender 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #050515;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      touch-action: manipulation;
    }
    #gameCanvas {
      background: radial-gradient(circle at center, #0a0a28 0%, #02020a 100%);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2">

  <!-- HUD Header -->
  <div class="w-full max-w-xl flex justify-between items-center bg-slate-900/80 border border-cyan-500/30 p-3 rounded-xl mb-3">
    <div>
      <span class="text-xs text-cyan-400 font-bold uppercase">Score</span>
      <div id="scoreText" class="text-2xl font-extrabold text-cyan-300">0</div>
    </div>
    <div class="text-center">
      <h1 class="text-lg font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-500">CYBER DEFENDER</h1>
    </div>
    <div class="text-right">
      <span class="text-xs text-rose-400 font-bold uppercase">Shield</span>
      <div id="livesText" class="text-2xl font-extrabold text-rose-500">❤️❤️❤️</div>
    </div>
  </div>

  <!-- Canvas Container -->
  <div class="relative w-full max-w-xl">
    <canvas id="gameCanvas" width="500" height="600" class="w-full rounded-2xl border-2 border-cyan-500/50 block"></canvas>
    
    <!-- Game Over Screen Overlay -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 backdrop-blur flex flex-col items-center justify-center rounded-2xl hidden">
      <h2 class="text-4xl font-black text-rose-500 tracking-wider mb-2 animate-bounce">GAME OVER</h2>
      <p class="text-slate-300 mb-4">Final Score: <span id="finalScore" class="text-cyan-400 font-bold">0</span></p>
      <button onclick="restartGame()" class="bg-gradient-to-r from-cyan-500 to-fuchsia-600 hover:from-cyan-400 hover:to-fuchsia-500 text-white font-bold px-8 py-3 rounded-xl shadow-lg shadow-cyan-500/40 text-lg transition">
        PLAY AGAIN
      </button>
    </div>
  </div>

  <!-- Mobile Controls -->
  <div class="w-full max-w-xl grid grid-cols-3 gap-2 mt-3">
    <button id="btnLeft" class="bg-slate-800 border border-cyan-500/40 text-cyan-400 font-bold py-4 rounded-xl text-xl active:bg-cyan-900/50">◀ LEFT</button>
    <button id="btnFire" class="bg-gradient-to-r from-fuchsia-600 to-rose-600 text-white font-black py-4 rounded-xl text-xl active:scale-95 shadow-lg shadow-fuchsia-600/30">🔥 FIRE</button>
    <button id="btnRight" class="bg-slate-800 border border-cyan-500/40 text-cyan-400 font-bold py-4 rounded-xl text-xl active:bg-cyan-900/50">RIGHT ▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let gameOver = false;

    // Player Object
    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 50,
      width: 40,
      height: 30,
      speed: 6,
      dx: 0
    };

    // Arrays
    let bullets = [];
    let enemies = [];
    let particles = [];

    // Keys
    const keys = { left: false, right: false, space: false };

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        if (!keys.space) shootBullet();
        keys.space = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === ' ' || e.key === 'Spacebar') keys.space = false;
    });

    // Mobile Touch Listeners
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnFire = document.getElementById('btnFire');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); shootBullet(); });

    btnLeft.addEventListener('mousedown', () => keys.left = true);
    btnLeft.addEventListener('mouseup', () => keys.left = false);
    btnRight.addEventListener('mousedown', () => keys.right = true);
    btnRight.addEventListener('mouseup', () => keys.right = false);
    btnFire.addEventListener('click', () => shootBullet());

    function shootBullet() {
      if (gameOver) return;
      bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 15,
        speed: 9
      });
    }

    function spawnEnemy() {
      if (gameOver) return;
      const size = Math.random() * 20 + 25;
      enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: Math.random() * 2 + 1.5 + (score / 100)
      });
    }

    setInterval(spawnEnemy, 1000);

    function createExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x,
          y: y,
          dx: (Math.random() - 0.5) * 6,
          dy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          alpha: 1,
          color: color
        });
      }
    }

    function update() {
      if (gameOver) return;

      // Move player
      if (keys.left && player.x > 0) player.x -= player.speed;
      if (keys.right && player.x + player.width < canvas.width) player.x += player.speed;

      // Bullets
      bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(index, 1);
      });

      // Enemies
      enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        // Player collision
        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          createExplosion(enemy.x, enemy.y, '#f43f5e');
          enemies.splice(eIndex, 1);
          lives--;
          updateHUD();
          if (lives <= 0) endGame();
        }

        // Bottom hit
        if (enemy.y > canvas.height) {
          enemies.splice(eIndex, 1);
          lives--;
          updateHUD();
          if (lives <= 0) endGame();
        }

        // Bullet hit
        bullets.forEach((b, bIndex) => {
          if (
            b.x < enemy.x + enemy.width &&
            b.x + b.width > enemy.x &&
            b.y < enemy.y + enemy.height &&
            b.y + b.height > enemy.y
          ) {
            createExplosion(enemy.x, enemy.y, '#00f3ff');
            enemies.splice(eIndex, 1);
            bullets.splice(bIndex, 1);
            score += 10;
            updateHUD();
          }
        });
      });

      // Particles
      particles.forEach((p, pIndex) => {
        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) particles.splice(pIndex, 1);
      });
    }

    function updateHUD() {
      document.getElementById('scoreText').innerText = score;
      document.getElementById('livesText').innerText = '❤️'.repeat(Math.max(0, lives));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player
      ctx.fillStyle = '#00f3ff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f3ff';
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // Bullets
      ctx.fillStyle = '#d946ef';
      ctx.shadowColor = '#d946ef';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, b.width, b.height);
      });

      // Enemies
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      enemies.forEach(e => {
        ctx.fillRect(e.x, e.y, e.width, e.height);
      });

      // Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function endGame() {
      gameOver = true;
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
    }

    function restartGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      bullets = [];
      enemies = [];
      particles = [];
      updateHUD();
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    loop();
  </script>
</body>
</html>

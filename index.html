<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ঢাকা চাকা 3D - Fixed Architecture</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .hud-top { display: flex; justify-content: space-between; }
        .box { background: rgba(0,0,0,0.75); border: 2px solid #f1c40f; color: white; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
        .controls-container { pointer-events: auto; display: flex; width: 100%; justify-content: space-between; }
        .btn-group { display: flex; gap: 10px; }
        .btn { width: 65px; height: 65px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .btn:active { background: #f1c40f; color: black; }
        .overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:100; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; text-align:center; }
        .start-btn { background:#27ae60; color:white; font-size:22px; padding:12px 30px; border:none; border-radius:25px; cursor:pointer; font-weight:bold; margin-top:15px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-top">
            <div class="box">স্কোর: <span id="score" style="color:#f1c40f">0</span> | রুট: <span style="color:#2ecc71">মিরপুর ১০</span></div>
            <div class="box">স্পিড: <span id="speed" style="color:#3498db">0</span> KM/H</div>
        </div>
        <div class="controls-container">
            <div class="btn-group">
                <div class="btn" id="b-left">◄</div>
                <div class="btn" id="b-right">►</div>
            </div>
            <div class="btn-group">
                <div class="btn" id="b-brake" style="background:rgba(231,76,60,0.6)">ব্রেক</div>
                <div class="btn" id="b-gas" style="background:rgba(46,204,113,0.6)">গ্যাস</div>
            </div>
        </div>
    </div>

    <div class="overlay" id="start-screen">
        <h1 style="color:#f1c40f; font-size:36px;">ঢাকা লোকাল বাস ৩ডি</h1>
        <p style="margin-top:10px; color:#ccc;">কন্ট্রোল ও ক্যামেরা সম্পূর্ণ ফিক্স করা হয়েছে</p>
        <button class="start-btn" onclick="startGame()">গেম খেলুন</button>
    </div>

    <script>
        let scene, camera, renderer, playerBus, roadSegment;
        let speed = 0, busX = 0;
        let keys = { f: false, b: false, l: false, r: false };
        let active = false;

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 150);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting

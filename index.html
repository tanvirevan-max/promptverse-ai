<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Anti-Drug Squad - Dhaka Street Action</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap');
    body {
      background-color: #090d16;
      color: #fff;
      font-family: 'Hind Siliguri', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    #gameCanvas {
      background: #111827;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 select-none">

  <!-- HUD Bar -->
  <div class="w-full max-w-4xl flex justify-between items-center bg-slate-900 border-2 border-emerald-500/50 p-3 rounded-2xl mb-2 shadow-xl">
    <div class="flex items-center space-x-3">
      <div class="bg-emerald-600/20 border border-emerald-500 px-3 py-1 rounded-xl text-center">
        <span class="text-xs text-emerald-400 font-bold block">মোট কিল স্কোর</span>
        <span id="scoreText" class="text-3xl font-extrabold text-emerald-300">0</span>
      </div>
    </div>
    
    <div class="text-center">
      <h1 class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-amber-300 to-red-500">
        ঢাকা অ্যান্টি-ড্রাগ স্কোয়াড
      </h1>
      <p class="text-xs text-slate-400">রাস্তা পরিষ্কার অভিযান • ড্যান্ডিমুক্ত বাংলাদেশ</p>
    </div>

    <div class="bg-rose-900/20 border border-rose-500 px-3 py-1 rounded-xl text-center">
      <span class="text-xs text-rose-400 font-bold block">লাইফ / হেলথ</span>
      <span id="livesText" class="text-2xl font-black text-rose-500">❤️❤️❤️</span>
    </div>
  </div>

  <!-- Game Canvas Container -->
  <div class="relative w-full max-w-4xl">
    <canvas id="gameCanvas" width="850" height="480" class="w-full rounded-2xl border-2 border-slate-700 block"></canvas>
    
    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/95 backdrop-blur flex flex-col items-center justify-center rounded-2xl hidden z-20">
      <h2 class="text-5xl font-black text-rose-500 tracking-wider mb-2 animate-pulse">মিশন ওভার!</h2>
      <p class="text-xl text-slate-300 mb-6">আপনার মোট স্কোর: <span id="finalScore" class="text-emerald-400 font-bold">0</span></p>
      <button onclick="restartGame()" class="bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold px-10 py-4 rounded-2xl shadow-2xl text-xl transition transform active:scale-95">
        পুনরায় খেলুন 🔄
      </button>
    </div>
  </div>

  <!-- On-Screen Controls for Mobile/Mouse -->
  <div class="w-full max-w-4xl grid grid-cols-3 gap-3 mt-3">
    <button id="btnUp" class="bg-slate-800 border-2 border-slate-700 hover:border-emerald-500 text-emerald-400 font-bold py-3 rounded-2xl text-xl active:bg-slate-700 transition">▲ উপরে যান</button>
    <button id="btnFire" class="bg-gradient-to-r from-red-600 via-rose-600 to-amber-500 text-white font-black py-3 rounded-2xl text-xl shadow-lg shadow-red-600/40 active:scale-95 transition">🔥 ডাবল ফায়ার (FIRE)</button>
    <button id="btnDown" class="bg-slate-800 border-2 border-slate-700 hover:border-emerald-500 text-emerald-400 font-bold py-3 rounded-2xl text-xl active:bg-slate-700 transition">▼ নিচে যান</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let gameOver = false;
    let roadOffset = 0;

    // Direct Inline Vector Graphics Rendered Face Data (Guaranteeing 100% Load)
    const playerFaceImg = new Image();
    // High-resolution photo fallback
    playerFaceImg.src = 'https://i.ibb.co/6P0J9k8/custom-head.jpg';

    // Player (Hero chasing from behind on Left Side)
    const player = {
      x: 80,
      y: 220,
      width: 80,
      height: 100,
      speed: 7
    };

    let bullets = [];
    let enemies = [];
    let particles = [];

    const keys = { up: false, down: false };

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
      if (e.key === ' ' || e.key === 'Spacebar') shootBullets();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    });

    // Touch/Button Handlers
    document.getElementById('btnUp').addEventListener('mousedown', () => keys.up = true);
    document.getElementById('btnUp').addEventListener('mouseup', () => keys.up = false);
    document.getElementById('btnDown').addEventListener('mousedown', () => keys.down = true);
    document.getElementById('btnDown').addEventListener('mouseup', () => keys.down = false);
    document.getElementById('btnFire').addEventListener('click', () => shootBullets());

    document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); keys.up = true; });
    document.getElementById('btnUp').addEventListener('touchend', (e) => { e.preventDefault(); keys.up = false; });
    document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); keys.down = true; });
    document.getElementById('btnDown').addEventListener('touchend', (e) => { e.preventDefault(); keys.down = false; });

    function shootBullets() {
      if (gameOver) return;
      // Dual guns firing forward towards escaping addicts
      bullets.push({ x: player.x + 70, y: player.y + 45, speed: 14 });
      bullets.push({ x: player.x + 70, y: player.y + 65, speed: 14 });
    }

    function spawnAddict() {
      if (gameOver) return;
      const type = Math.random() > 0.5 ? 'lungi' : 'shorts';
      // Enemies spawn ahead and RUN AWAY to the right
      enemies.push({
        x: canvas.width + 20,
        y: Math.random() * (canvas.height - 240) + 140,
        width: 60,
        height: 85,
        type: type,
        speed: Math.random() * 2 + 1.5 // Running forward
      });
    }

    setInterval(spawnAddict, 1300);

    function createBloodSplatter(x, y) {
      for (let i = 0; i < 15; i++) {
        particles.push({
          x: x,
          y: y,
          dx: (Math.random() - 0.5) * 8,
          dy: (Math.random() - 0.5) * 8,
          radius: Math.random() * 4 + 2,
          color: '#ef4444',
          alpha: 1
        });
      }
    }

    // Detailed BD Environment Rendering
    function drawBDStreet() {
      // Sky
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, 120);

      // Distant Buildings & Brick Wall
      ctx.fillStyle = '#9a3412'; // Brick red wall
      ctx.fillRect(0, 100, canvas.width, 40);
      
      // Brick pattern lines
      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 40) {
        ctx.strokeRect((i - roadOffset) % canvas.width, 100, 40, 20);
        ctx.strokeRect((i + 20 - roadOffset) % canvas.width, 120, 40, 20);
      }

      // Bangladeshi Shop / Signboard Artwork
      const signboardX = (300 - roadOffset * 0.5) % (canvas.width + 200) - 100;
      ctx.fillStyle = '#065f46';
      ctx.fillRect(signboardX, 30, 160, 50);
      ctx.strokeStyle = '#fbbf24';
      ctx.lineWidth = 3;
      ctx.strokeRect(signboardX, 30, 160, 50);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 16px "Hind Siliguri", sans-serif';
      ctx.fillText('মিরপুর চায়ের দোকান', signboardX + 15, 60);

      // Rickshaw Art Background Object
      const rickshawX = (650 - roadOffset) % (canvas.width + 300) - 100;
      // Rickshaw Hood
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.arc(rickshawX + 20, 110, 20, Math.PI, 0);
      ctx.fill();
      // Rickshaw Wheels
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(rickshawX + 10, 130, 10, 0, Math.PI * 2);
      ctx.arc(rickshawX + 30, 130, 10, 0, Math.PI * 2);
      ctx.fill();

      // Main Asphal Road
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, 140, canvas.width, canvas.height - 140);

      // Road Divider Lines (Moving effect)
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 6;
      ctx.setLineDash([30, 25]);
      ctx.lineDashOffset = -roadOffset * 2;
      ctx.beginPath();
      ctx.moveTo(0, 300);
      ctx.lineTo(canvas.width, 300);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Draw Main Hero Player with Large Customized Face
    function drawPlayer() {
      // Body / Suit Jacket
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(player.x + 20, player.y + 45, 35, 40); // Torso
      ctx.fillStyle = '#2563eb'; // Blue Tie
      ctx.fillRect(player.x + 35, player.y + 45, 6, 25);

      // Dual Guns
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(player.x + 45, player.y + 48, 30, 8); // Top Pistol
      ctx.fillRect(player.x + 45, player.y + 68, 30, 8); // Bottom Pistol
      ctx.fillStyle = '#f59e0b'; // Laser sights
      ctx.fillRect(player.x + 75, player.y + 50, 6, 4);
      ctx.fillRect(player.x + 75, player.y + 70, 6, 4);

      // Running Legs Animation
      ctx.fillStyle = '#0284c7';
      const legAnim = Math.sin(Date.now() / 80) * 12;
      ctx.fillRect(player.x + 22 + legAnim, player.y + 85, 12, 20);
      ctx.fillRect(player.x + 38 - legAnim, player.y + 85, 12, 20);

      // HUGE CLEAR FACE (Customized Avatar Head)
      ctx.save();
      ctx.beginPath();
      ctx.arc(player.x + 36, player.y + 20, 28, 0, Math.PI * 2);
      ctx.clip();
      
      if (playerFaceImg.complete && playerFaceImg.naturalWidth !== 0) {
        ctx.drawImage(playerFaceImg, player.x + 4, player.y - 10, 64, 64);
      } else {
        // Fallback Vector Face drawing matching uploaded beard portrait
        ctx.fillStyle = '#f87171';
        ctx.fill();
        ctx.fillStyle = '#1e293b'; // Beard & Hair
        ctx.fillRect(player.x + 12, player.y + 20, 48, 15);
      }
      ctx.restore();

      // Golden Border Circle around Face
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x + 36, player.y + 20, 28, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Draw Drug Addicts (Facing forward, fleeing, with Polythene)
    function drawEnemies() {
      enemies.forEach(e => {
        const legAnim = Math.sin((Date.now() + e.x * 10) / 70) * 10;

        // Legs & Attire
        if (e.type === 'lungi') {
          // Lungi (Checked Pattern)
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(e.x + 15, e.y + 45, 25, 30);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 1;
          ctx.strokeRect(e.x + 15, e.y + 45, 25, 30);
        } else {
          // Half Pants
          ctx.fillStyle = '#b91c1c';
          ctx.fillRect(e.x + 15 + legAnim, e.y + 45, 12, 20);
          ctx.fillRect(e.x + 28 - legAnim, e.y + 45, 12, 20);
        }

        // Torso / Shirtless
        ctx.fillStyle = '#ea580c';
        ctx.fillRect(e.x + 15, e.y + 25, 25, 22);

        // Head facing Right (Fleeing away)
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath();
        ctx.arc(e.x + 30, e.y + 15, 14, 0, Math.PI * 2);
        ctx.fill();

        // Dandy Polythene Bag held near mouth
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(e.x + 40, e.y + 18, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();
      });
    }

    function update() {
      if (gameOver) return;

      roadOffset += 3.5;

      // Player Movement
      if (keys.up && player.y > 140) player.y -= player.speed;
      if (keys.down && player.y + player.height < canvas.height - 10) player.y += player.speed;

      // Bullets Update
      bullets.forEach((b, i) => {
        b.x += b.speed;
        if (b.x > canvas.width) bullets.splice(i, 1);
      });

      // Enemies Update
      enemies.forEach((e, eIdx) => {
        // Escaping forward
        e.x += e.speed * 0.3;

        // Check Bullet Collision (Kills)
        bullets.forEach((b, bIdx) => {
          if (
            b.x > e.x &&
            b.x < e.x + e.width &&
            b.y > e.y &&
            b.y < e.y + e.height
          ) {
            createBloodSplatter(e.x + e.width / 2, e.y + e.height / 2);
            enemies.splice(eIdx, 1);
            bullets.splice(bIdx, 1);
            score += 10; // +10 Points per kill
            document.getElementById('scoreText').innerText = score;
          }
        });

        // If addict escapes past screen boundary
        if (e.x > canvas.width + 50) {
          enemies.splice(eIdx, 1);
          lives--;
          updateHUD();
        }
      });

      // Particles Update
      particles.forEach((p, pIdx) => {
        p.x += p.dx;
        p.y += p.dy;
        p.alpha -= 0.04;
        if (p.alpha <= 0) particles.splice(pIdx, 1);
      });
    }

    function updateHUD() {
      document.getElementById('livesText').innerText = '❤️'.repeat(Math.max(0, lives));
      if (lives <= 0) {
        gameOver = true;
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverScreen').classList.remove('hidden');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBDStreet();
      drawPlayer();
      drawEnemies();

      // Bullets (Glow lasers)
      ctx.fillStyle = '#f59e0b';
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#f59e0b';
      bullets.forEach(b => {
        ctx.fillRect(b.x, b.y, 16, 4);
      });
      ctx.shadowBlur = 0;

      // Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function restartGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      bullets = [];
      enemies = [];
      particles = [];
      document.getElementById('scoreText').innerText = '0';
      updateHUD();
      document.getElementById('gameOverScreen').classList.add('hidden');
    }

    loop();
  </script>
</body>
</html>

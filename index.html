<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ঢাকা চাকা ৩ডি - Dhaka Local Bus Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #f59e0b;
            border-radius: 10px;
            padding: 10px 16px;
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
        }

        .hud-card .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .hud-card .value {
            font-size: 26px;
            font-weight: bold;
            color: #fbbf24;
        }

        .hud-card .value-blue {
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
        }

        .badge {
            background: #10b981;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 4px;
            align-self: flex-start;
        }

        .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .speed-dial {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #38bdf8;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .speed-dial #speed-num {
            font-size: 26px;
            font-weight: bold;
            color: #38bdf8;
            line-height: 1;
        }

        .speed-dial small {
            font-size: 9px;
            color: #94a3b8;
        }

        .touch-controls {
            pointer-events: auto;
            display: flex;
            gap: 15px;
        }

        .control-group {
            display: flex;
            gap: 10px;
        }

        .ctrl-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            cursor: pointer;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: #f59e0b;
            color: #000;
        }

        .green-btn { background: rgba(16, 185, 129, 0.4); border-color: #10b981; }
        .red-btn { background: rgba(239, 68, 68, 0.4); border-color: #ef4444; }
        .yellow-btn { background: rgba(245, 158, 11, 0.4); border-color: #f59e0b; }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(15,23,42,0.95), rgba(0,0,0,0.9));
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .game-title {
            font-size: 42px;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .game-subtitle {
            color: #cbd5e1;
            font-size: 16px;
            max-width: 480px;
            margin-bottom: 25px;
        }

        .start-btn {
            background: #10b981;
            color: white;
            font-size: 22px;
            padding: 14px 40px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .start-btn:hover {
            background: #059669;
        }
    </style>
    <!-- Three.js CDN Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    
    <!-- UI Overlay -->
    <div id="hud-overlay">
        <div class="hud-top">
            <div class="hud-card">
                <span class="label">স্কোর</span>
                <span id="score-val" class="value">000000</span>
                <span id="bus-name" class="badge">অসীম পরিবহন</span>
            </div>
            <div class="hud-card location-card">
                <span class="label">এলাকা</span>
                <span id="location-name" class="value-blue">মিরপুর ১০ মোড়</span>
            </div>
        </div>

        <div class="hud-bottom">
            <div class="speed-dial">
                <span id="speed-num">0</span>
                <small>KM/H</small>
            </div>

            <div id="touch-controls" class="touch-controls">
                <div class="control-group">
                    <button id="btn-left" class="ctrl-btn">◄</button>
                    <button id="btn-right" class="ctrl-btn">►</button>
                </div>
                <div class="control-group">
                    <button id="btn-horn" class="ctrl-btn yellow-btn">📢</button>
                    <button id="btn-brake" class="ctrl-btn red-btn">ব্রেক</button>
                    <button id="btn-gas" class="ctrl-btn green-btn">গ্যাস</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay-screen">
        <h1 class="game-title">ঢাকা চাকা ৩ডি</h1>
        <p class="game-subtitle">আসল ঢাকা শহরের ড্রাইভ অভিজ্ঞতা - লোকাল বাস, রিকশা, সিএনজি ও টং দোকান</p>
        <button id="start-btn" class="start-btn">গেম শুরু করুন</button>
    </div>

    <script>
        /* === CONTROLS ENGINE === */
        class Controls {
            constructor() {
                this.keys = { forward: false, backward: false, left: false, right: false, boost: false, horn: false };
                this.initKeyboard();
                this.initTouchControls();
            }

            initKeyboard() {
                window.addEventListener('keydown', (e) => this.handleKey(e, true));
                window.addEventListener('keyup', (e) => this.handleKey(e, false));
            }

            handleKey(e, isPressed) {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': this.keys.forward = isPressed; break;
                    case 'KeyS': case 'ArrowDown': this.keys.backward = isPressed; break;
                    case 'KeyA': case 'ArrowLeft': this.keys.left = isPressed; break; // সঠিক বামের ড্রাইভিং
                    case 'KeyD': case 'ArrowRight': this.keys.right = isPressed; break; // সঠিক ডানের ড্রাইভিং
                    case 'ShiftLeft': case 'ShiftRight': this.keys.boost = isPressed; break;
                    case 'KeyH': this.keys.horn = isPressed; if(isPressed) playHornSound(); break;
                }
            }

            initTouchControls() {
                this.bindTouch('btn-left', 'left');
                this.bindTouch('btn-right', 'right');
                this.bindTouch('btn-gas', 'forward');
                this.bindTouch('btn-brake', 'backward');
                this.bindTouch('btn-horn', 'horn');
            }

            bindTouch(btnId, action) {
                const btn = document.getElementById(btnId);
                if (!btn) return;
                const start = (e) => { e.preventDefault(); this.keys[action] = true; if(action==='horn') playHornSound(); };
                const end = (e) => { e.preventDefault(); this.keys[action] = false; };
                btn.addEventListener('touchstart', start, { passive: false });
                btn.addEventListener('touchend', end, { passive: false });
                btn.addEventListener('mousedown', start);
                btn.addEventListener('mouseup', end);
            }
        }

        /* === PLAYER BUS MODEL === */
        class PlayerBus {
            constructor(scene) {
                this.scene = scene;
                this.mesh = new THREE.Group();
                this.speed = 0;
                this.maxSpeed = 1.2;
                this.acceleration = 0.015;
                this.deceleration = 0.96;

                this.buildBusModel();
                this.scene.add(this.mesh);
            }

            buildBusModel() {
                // ১. বাসের সবুজ বডি (Local Green Bus Body)
                const bodyGeo = new THREE.BoxGeometry(2.4, 2.6, 7.2);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.3 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 1.6;
                body.castShadow = true;
                this.mesh.add(body);

                // ২. হলুদ স্ট্রাইপ (Bus Stripe Banner)
                const stripeGeo = new THREE.BoxGeometry(2.42, 0.5, 7.1);
                const stripeMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
                const stripe = new THREE.Mesh(stripeGeo, stripeMat);
                stripe.position.y = 1.3;
                this.mesh.add(stripe);

                // ৩. ছাদে ছ্যাঁকড়া/লাগেজ র‌্যাক (Roof Rack)
                const rackGeo = new THREE.BoxGeometry(2.2, 0.3, 4.8);
                const rackMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
                const rack = new THREE.Mesh(rackGeo, rackMat);
                rack.position.set(0, 3.05, -0.4);
                this.mesh.add(rack);

                // ৪. জানালা (Glass Windows)
                const winMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
                const winGeo = new THREE.BoxGeometry(2.44, 0.8, 5.0);
                const windows = new THREE.Mesh(winGeo, winMat);
                windows.position.set(0, 2.1, 0.2);
                this.mesh.add(windows);

                // ৫. হেডলাইট (Headlights)
                const lightGeo = new THREE.BoxGeometry(0.4, 0.25, 0.1);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
                const lightL = new THREE.Mesh(lightGeo, lightMat);
                lightL.position.set(-0.8, 0.8, 3.61);
                const lightR = lightL.clone();
                lightR.position.x = 0.8;
                this.mesh.add(lightL); this.mesh.add(lightR);

                // ৬. দরজায় ঝুলন্ত হেল্পার (Door Helper)
                const helperGeo = new THREE.BoxGeometry(0.4, 1.0, 0.4);
                const helperMat = new THREE.MeshStandardMaterial({ color: 0xe11d48 });
                this.helper = new THREE.Mesh(helperGeo, helperMat);
                this.helper.position.set(1.3, 1.4, 1.2);
                this.mesh.add(this.helper);
            }

            update(controls) {
                const currentMax = controls.keys.boost ? this.maxSpeed * 1.5 : this.maxSpeed;

                if (controls.keys.forward) {
                    this.speed = Math.min(this.speed + this.acceleration, currentMax);
                } else if (controls.keys.backward) {
                    this.speed = Math.max(this.speed - this.acceleration * 2, -this.maxSpeed * 0.3);
                } else {
                    this.speed *= this.deceleration;
                }

                // ডানে/বামে সঠিক ড্রাইভিং কন্ট্রোল
                if (controls.keys.left) {
                    this.mesh.position.x -= 0.12; // বামে সরবে
                    this.mesh.rotation.y = 0.08;
                } else if (controls.keys.right) {
                    this.mesh.position.x += 0.12; // ডানে সরবে
                    this.mesh.rotation.y = -0.08;
                } else {
                    this.mesh.rotation.y = 0;
                }

                this.mesh.position.x = Math.max(-5.2, Math.min(5.2, this.mesh.position.x));
            }

            getPosition() { return this.mesh.position; }
            getSpeed() { return Math.abs(this.speed); }
        }

        /* === DHAKA ENVIRONMENT ENGINE === */
        class DhakaEnvironment {
            constructor(scene) {
                this.scene = scene;
                this.roadGroup = new THREE.Group();
                this.segmentLength = 25;
                this.totalSegments = 16;
                this.roadSegments = [];
                this.initEnvironment();
            }

            initEnvironment() {
                for (let i = 0; i < this.totalSegments; i++) {
                    const segment = this.createRoadSegment();
                    segment.position.z = i * this.segmentLength;
                    this.roadSegments.push(segment);
                    this.roadGroup.add(segment);
                }
                this.scene.add(this.roadGroup);
            }

            createRoadSegment() {
                const seg = new THREE.Group();

                // পিচ রাস্তা
                const roadGeo = new THREE.PlaneGeometry(14, this.segmentLength);
                const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
                const road = new THREE.Mesh(roadGeo, roadMat);
                road.rotation.x = -Math.PI / 2;
                road.receiveShadow = true;
                seg.add(road);

                // ফুটপাত
                const walkGeo = new THREE.BoxGeometry(3.5, 0.3, this.segmentLength);
                const walkMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
                const walkL = new THREE.Mesh(walkGeo, walkMat);
                walkL.position.set(-8.75, 0.15, 0);
                const walkR = walkL.clone();
                walkR.position.x = 8.75;
                seg.add(walkL); seg.add(walkR);

                // টং দোকান ও বিল্ডিং
                if (Math.random() > 0.3) {
                    const shopGeo = new THREE.BoxGeometry(4, 3.2, 5);
                    const shopMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0x0284c7 : 0xd97706 });
                    const shop = new THREE.Mesh(shopGeo, shopMat);
                    shop.position.set(Math.random() > 0.5 ? 12.5 : -12.5, 1.6, 0);
                    seg.add(shop);
                }

                return seg;
            }

            update(busSpeed) {
                this.roadSegments.forEach(seg => {
                    seg.position.z -= busSpeed * 10;
                    if (seg.position.z < -this.segmentLength) {
                        seg.position.z += this.totalSegments * this.segmentLength;
                    }
                });
            }
        }

        /* === TRAFFIC MANAGER === */
        class TrafficManager {
            constructor(scene) {
                this.scene = scene;
                this.vehicles = [];
                this.initTraffic();
            }

            initTraffic() {
                for (let i = 0; i < 8; i++) {
                    const vehicle = this.createRickshawOrCNG();
                    vehicle.position.set((Math.floor(Math.random() * 3) - 1) * 3.8, 0.8, 40 + i * 30);
                    vehicle.userData = { speed: 0.1 + Math.random() * 0.2 };
                    this.vehicles.push(vehicle);
                    this.scene.add(vehicle);
                }
            }

            createRickshawOrCNG() {
                const group = new THREE.Group();
                const isCNG = Math.random() > 0.5;
                const geo = new THREE.BoxGeometry(1.5, 1.5, 2.4);
                const mat = new THREE.MeshStandardMaterial({ color: isCNG ? 0x15803d : 0xb91c1c });
                const mesh = new THREE.Mesh(geo, mat);
                group.add(mesh);
                return group;
            }

            update(busSpeed, busPos) {
                this.vehicles.forEach(v => {
                    v.position.z -= (busSpeed * 10) - (v.userData.speed * 3);
                    if (v.position.z < -20) {
                        v.position.z = 200 + Math.random() * 40;
                        v.position.x = (Math.floor(Math.random() * 3) - 1) * 3.8;
                    }

                    // বাসের সাথে সংঘর্ষ
                    if (Math.abs(busPos.z - v.position.z) < 4.5 && Math.abs(busPos.x - v.position.x) < 2.0) {
                        v.position.x += (v.position.x > busPos.x ? 1.0 : -1.0);
                    }
                });
            }
        }

        /* === SOUND SYNTHESIS === */
        function playHornSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.setValueAtTime(360, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.35);
            } catch(e) {}
        }

        /* === MAIN GAME CLASS === */
        class Game {
            constructor() {
                this.container = document.getElementById('canvas-container');
                this.initThreeJS();
                this.controls = new Controls();
                this.playerBus = new PlayerBus(this.scene);
                this.environment = new DhakaEnvironment(this.scene);
                this.trafficManager = new TrafficManager(this.scene);
                this.score = 0;

                window.addEventListener('resize', () => this.onWindowResize());
            }

            initThreeJS() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x7dd3fc);
                this.scene.fog = new THREE.FogExp2(0x7dd3fc, 0.008);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.container.appendChild(this.renderer.domElement);

                const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
                this.scene.add(ambientLight);

                const sun = new THREE.DirectionalLight(0xfffbeb, 0.85);
                sun.position.set(40, 80, 40);
                sun.castShadow = true;
                this.scene.add(sun);
            }

            start() {
                this.animate();
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.playerBus.update(this.controls);
                const busSpeed = this.playerBus.getSpeed();
                const busPos = this.playerBus.getPosition();

                this.environment.update(busSpeed);
                this.trafficManager.update(busSpeed, busPos);

                // থার্ড-পারসন অনুসরণকারী ক্যামেরা
                this.camera.position.x = busPos.x * 0.6;
                this.camera.position.y = busPos.y + 4.8;
                this.camera.position.z = busPos.z - 9.5;
                this.camera.lookAt(busPos.x, busPos.y + 1.8, busPos.z + 10);

                // UI স্পিড ও স্কোর আপডেট
                document.getElementById('speed-num').innerText = Math.floor(busSpeed * 85);
                this.score += Math.floor(busSpeed * 5);
                document.getElementById('score-val').innerText = String(this.score).padStart(6, '0');

                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // গেম শুরু বাটন লিসেনার
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').style.display = 'none';
            const game = new Game();
            game.start();
        });
    </script>
</body>
</html>
